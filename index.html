<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع الشعر الشيعي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="about-image.jpg" alt="صورة عن الموقع" class="about-img">
    <h1>موقع الشعر الشيعي</h1>
  </header>

  <!-- خانة الشعراء -->
  <section id="poets" data-aos="fade-up">
    <h2>أسماء الشعراء</h2>
    <div class="poets-list">
      <ul>
        <!-- الشاعر الأول -->
        <li class="poet-name" onclick="togglePoems('poet1')">
          <img src="poets-image.jpg" alt="الشاعر علي بن أبي طالب" class="poet-img">
          الشاعر علي بن أبي طالب
        </li>
        <ul id="poet1" class="poet-poems">
          <li>قصيدة 1 - يا حسينُ وهل يُطفئ النورَ دمْعُ؟</li>
          <li>قصيدة 2 - ليلُ كربلاءَ...</li>
          <li>قصيدة 3 - صرخةُ العباسِ...</li>
        </ul>
        
        <!-- الشاعر الثاني -->
        <li class="poet-name" onclick="togglePoems('poet2')">
          <img src="قيس_4.jpg.webp" alt="الشاعر حسين الأهدل" class="poet-img">
          الشاعر حسين الأهدل
        </li>
        <ul id="poet2" class="poet-poems">
          <li>قصيدة 1 - أمل حياتي</li>
          <li>قصيدة 2 - ضوء النور</li>
          <li>قصيدة 3 - في ضوء الفجر</li>
        </ul>
        
        <!-- إضافة شعراء آخرين حسب الحاجة -->
      </ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
